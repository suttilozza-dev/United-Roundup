# Save this file as .github/workflows/source-tracking.yml in the repo root
# (GitHub Actions only recognizes workflows inside that exact folder).
#
# Publishes the site's live data to GitHub Pages
# (https://suttilozza-dev.github.io/United-Roundup/) instead of committing it
# to `main`, so data updates never trigger a paid Netlify deploy:
#   - every hour: fetch + classify the latest news -> latest-data.js
#   - every run:  rebuild Press Room Watch from the data in `main`
#                 -> press-room-data.js, press-room-sections.json,
#                    press-room-summary.js
# It also runs straight away whenever Press Room Watch data is pushed to
# `main` (e.g. after approving a new press conference). Those runs fetch the
# news too, so a push can never republish an out-of-date feed.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: Update Latest news feed

on:
  schedule:
    - cron: "7 * * * *"   # every hour, at 7 minutes past
  workflow_dispatch:         # lets you also trigger it manually from GitHub's UI
  push:
    branches: [main]
    paths:
      - assets/press-room-data.js
      - automation/press_room_conferences.json
      - automation/press_room_response_counts.json
      - automation/rebuild_press_room.py
      - automation/build_press_room_pages.py
      - press-room-watch.html

# Never run two publishes at once (each one replaces the whole Pages site).
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      FEED_URL: https://suttilozza-dev.github.io/United-Roundup
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install anthropic

      # Start from the last published feed (used when a source is briefly
      # down, and as-is on Press-Room-only runs) and the saved categories,
      # so only NEW stories are sent to the Claude API.
      - name: Restore last published feed and category cache
        run: |
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors "$FEED_URL/latest-data.js?run=${{ github.run_id }}" -o /tmp/latest-data.js && mv /tmp/latest-data.js assets/latest-data.js || echo "::warning::Could not restore the published feed - using the copy in the repo."
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors "$FEED_URL/classify_cache.json?run=${{ github.run_id }}" -o automation/classify_cache.json || echo "::warning::No category cache restored."

      - name: Validate sources (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        run: python automation/validate_sources.py

      - name: Fetch new items
        run: python automation/fetch_sources.py

      - name: Classify items
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python automation/classify.py --time-budget 600

      - name: Update site data
        run: python automation/update_site_data.py

      - name: Prepare files to publish
        run: |
          mkdir -p public
          cp assets/latest-data.js public/
          if [ -f automation/classify_cache.json ]; then cp automation/classify_cache.json public/; fi
          python automation/build_press_room_pages.py public
          echo "United Roundup live data. The website is https://unitedroundup.com" > public/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
